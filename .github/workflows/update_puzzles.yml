name: Auto-Update Quiz & Lichess Puzzles

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update quiz words & fetch Lichess puzzles
        run: |
          python scripts/scrape_puzzles.py
          python scripts/fetch_lichess_puzzles.py

      - name: Commit updated datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add extra_puzzles.json lichess_puzzles.json
          git diff --staged --quiet || git commit -m "chore: update words and lichess puzzles"
          git push
