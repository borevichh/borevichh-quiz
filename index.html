        <form id="cl-form" class="flex gap-2 w-full">
          <input id="cl-input" type="text" maxlength="${p.start.length}" placeholder="Слово (${p.start.length} б.)..." class="flex-1 px-4 py-3 rounded-xl surface-pill border-2 focus:border-amber-400 focus:outline-none font-black text-center text-lg uppercase tracking-widest" autocomplete="off" />
          <button type="submit" class="px-5 py-3 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-sm transition">ОК</button>
        </form>
      </div>
    `;
    onContinueCallback = () => { finished = false; render(); persist(); };
    function render() {
      const hist = document.getElementById('cl-history');
      let html = `<div class="flex items-center justify-between px-4 py-2 rounded-xl surface-pill border font-black tracking-widest"><span>СТАРТ</span><span>${p.start}</span></div>`;
      for (let i = 0; i < stepIdx; i++) html += `<div class="flex items-center justify-between px-4 py-2 rounded-xl bg-emerald-500/20 border border-emerald-400/30 text-emerald-400 font-bold"><span>Шаг ${i + 1} ✓</span><span class="font-black tracking-widest">${p.steps[i].word}</span></div>`;
      hist.innerHTML = html;
      const curStep = p.steps[stepIdx];
      if (curStep) document.getElementById('cl-active').innerHTML = `<div class="text-xs font-bold text-cyan-400 uppercase mb-1">Шаг ${stepIdx + 1} из ${p.steps.length} • Замените 1 букву</div><div class="text-base font-bold text-white-adaptive">${curStep.clue}</div>`;
    }
    document.getElementById('cl-form').addEventListener('submit', (e) => {
      e.preventDefault(); if (finished) return;
      const inp = document.getElementById('cl-input'), val = inp.value.trim().toUpperCase().replace(/Ё/g, 'Е');
      if (!val) return;
      if (val === p.steps[stepIdx].word) { sfx.good(); stepIdx += 1; inp.value = ''; render(); if (stepIdx >= p.steps.length) { finished = true; setTimeout(() => completeGame('cladder'), 200); } else persist(); }
      else { inp.classList.add('shake'); setTimeout(() => inp.classList.remove('shake'), 350); if (loseLife('Неверное слово в Лесенке!')) finished = true; }
    });
    activeHintFn = () => { if (finished || !spendCoinsForHint(20)) return; const target = p.steps[stepIdx].word; document.getElementById('cl-input').value = target.slice(0, 2); showToast(`Первые 2 буквы: ${target.slice(0, 2)}...`); };
    render();
  }

  // =========================================================================
  // GAME 8: АНАГРАММЫ (With Save/Restore)
  // =========================================================================
  function initAnygramGame(stage, saved) {
    const p = saved?.puzzle || pickPuzzle('ag', PUZZLES.anygram);
    const found = new Set(saved?.found || []);
    let pickedIndices = [], finished = false;
    function persist() { if (!finished) saveGameSession('anygram', { puzzle: p, found: [...found], lives: gameLives }); }
    onSyncLivesCallback = persist;

    stage.innerHTML = `
      <div class="w-full max-w-md flex flex-col items-center">
        <div id="ag-targets" class="flex flex-wrap justify-center gap-2 mb-6 w-full"></div>
        <div id="ag-current" class="h-12 min-w-[200px] px-4 rounded-2xl surface-pill border-2 flex items-center justify-center font-black text-2xl tracking-widest text-amber-400 mb-5"></div>
        <div id="ag-letters" class="flex flex-wrap justify-center gap-2 mb-5"></div>
        <div class="flex gap-2"><button id="ag-clear" class="px-4 py-2 rounded-xl surface-pill border font-bold text-sm">Сбросить</button><button id="ag-submit" class="px-5 py-2 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-sm">Проверить</button></div>
      </div>
    `;
    onContinueCallback = () => { finished = false; pickedIndices = []; render(); persist(); };
    function render() {
      document.getElementById('ag-targets').innerHTML = p.targets.map(w => `<div class="px-3 py-2 rounded-xl font-black text-sm tracking-widest border ${found.has(w) ? 'bg-emerald-500 text-white border-emerald-400' : 'surface-pill'}">${found.has(w) ? w : '• '.repeat(w.length).trim()}</div>`).join('');
      document.getElementById('ag-current').textContent = pickedIndices.map(i => p.letters[i]).join('');
      const lEl = document.getElementById('ag-letters');
      lEl.innerHTML = p.letters.map((ch, idx) => { const used = pickedIndices.includes(idx); return `<button data-idx="${idx}" ${used ? 'disabled' : ''} class="ag-letter w-11 h-11 sm:w-12 sm:h-12 rounded-2xl font-black text-xl border-b-4 transition ${used ? 'opacity-25 surface-pill' : 'bg-fuchsia-500/25 hover:bg-fuchsia-500/40 text-fuchsia-300 border-fuchsia-500/40'}">${ch}</button>`; }).join('');
      lEl.querySelectorAll('.ag-letter').forEach(b => b.addEventListener('click', () => { pickedIndices.push(+b.dataset.idx); sfx.tap(); render(); }));
    }
    document.getElementById('ag-clear').addEventListener('click', () => { pickedIndices = []; sfx.tap(); render(); });
    document.getElementById('ag-submit').addEventListener('click', () => {
      if (finished) return; const word = pickedIndices.map(i => p.letters[i]).join('');
      if (!word) return;
      if (p.targets.includes(word) && !found.has(word)) { found.add(word); pickedIndices = []; sfx.good(); render(); if (found.size === p.targets.length) { finished = true; setTimeout(() => completeGame('anygram'), 200); } else persist(); }
      else { pickedIndices = []; render(); if (loseLife(found.has(word) ? 'Это слово уже открыто!' : 'Такого слова нет в списке!')) finished = true; }
    });
    activeHintFn = () => { if (finished) return; const next = p.targets.find(w => !found.has(w)); if (!next || !spendCoinsForHint(20)) return; found.add(next); render(); if (found.size === p.targets.length) { finished = true; setTimeout(() => completeGame('anygram'), 200); } else persist(); };
    render();
  }

  // =========================================================================
  // GAME 9: КРИПТОГРАММА (Red Error + Life Loss + "Слабый" Hint Button + Save)
  // =========================================================================
  function initCryptogramGame(stage, saved) {
    const p = saved?.puzzle || pickPuzzle('cg', PUZZLES.cryptogram);
    const uniqueLetters = [...new Set(p.quote.replace(/\s+/g, '').split(''))];
    const cipherMap = {}; uniqueLetters.forEach((ch, idx) => { cipherMap[ch] = idx + 1; });
    const revealed = new Set(saved?.revealed || uniqueLetters.slice(0, state.hardMode ? 1 : 3));
    const userMap = saved?.userMap ? { ...saved.userMap } : {};
    const wrongMap = saved?.wrongMap ? { ...saved.wrongMap } : {};
    revealed.forEach(ch => { userMap[ch] = ch; delete wrongMap[ch]; });
    let selectedChar = uniqueLetters.find(ch => !revealed.has(ch) && userMap[ch] !== ch) || uniqueLetters[0];
    let finished = false;

    function persist() {
      if (!finished) saveGameSession('cryptogram', {
        puzzle: p, revealed: [...revealed], userMap, wrongMap, lives: gameLives
      });
    }
    onSyncLivesCallback = persist;

    stage.innerHTML = `
      <div class="w-full max-w-2xl flex flex-col items-center">
        <div class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-3">Автор: ${p.author}</div>
        <div id="cg-phrase" class="flex flex-wrap justify-center gap-x-4 gap-y-3 mb-4"></div>
        <button id="cg-weak-hint" class="mb-5 px-4 py-2.5 rounded-2xl bg-gradient-to-r from-rose-500/25 via-amber-500/25 to-purple-500/25 hover:from-rose-500/35 hover:to-purple-500/35 border border-amber-400/40 text-amber-200 font-black text-xs sm:text-sm shadow-lg transition transform active:scale-95">
          😏 Нажми на подсказку, если слабый (откроет 1 букву)
        </button>
        <div id="cg-kb" class="w-full max-w-md flex flex-col gap-1"></div>
      </div>
    `;
    const checkWin = () => uniqueLetters.every(ch => userMap[ch] === ch);
    onContinueCallback = () => { finished = false; render(); persist(); };

    function revealOneLetter(useCoinsCost = 0) {
      if (finished) return;
      const missing = uniqueLetters.find(c => userMap[c] !== c);
      if (!missing) { showToast('Все буквы уже открыты!'); return; }
      if (useCoinsCost > 0 && !spendCoinsForHint(useCoinsCost)) return;
      userMap[missing] = missing;
      delete wrongMap[missing];
      revealed.add(missing);
      selectedChar = uniqueLetters.find(c => !revealed.has(c) && userMap[c] !== c) || missing;
      sfx.good();
      showToast(`Открыта буква «${missing}»!`);
      render();
      if (checkWin()) { finished = true; setTimeout(() => completeGame('cryptogram', `«${p.quote}» — ${p.author}`), 250); }
      else persist();
    }

    function render() {
      document.getElementById('cg-phrase').innerHTML = p.quote.split(' ').map(word => `<div class="flex gap-1">${word.split('').map(ch => {
        const isFixed = revealed.has(ch);
        const isCorrect = userMap[ch] === ch;
        const badAttempt = wrongMap[ch];
        const guess = isCorrect ? ch : (badAttempt || '');
        const isSel = selectedChar === ch && !isFixed;
        let cls = 'surface-pill border';
        if (isFixed) cls = 'bg-emerald-500/20 border-emerald-400/50 text-emerald-300';
        else if (isCorrect) cls = 'bg-emerald-500/25 border-emerald-400 text-emerald-200 tile-pop';
        else if (badAttempt) cls = 'bg-rose-500/30 border-rose-500 text-rose-200 shake';
        else if (isSel) cls = 'bg-amber-400/25 border-amber-400 text-amber-300';
        return `<button data-ch="${ch}" class="cg-cell flex flex-col items-center w-8 sm:w-9 py-1.5 rounded-lg border-2 transition ${cls}"><span class="font-black text-base h-6 leading-6">${guess}</span><span class="text-[10px] font-bold text-muted-adaptive border-t border-white/10 w-full text-center mt-0.5 pt-0.5">${cipherMap[ch]}</span></button>`;
      }).join('')}</div>`).join('');

      document.querySelectorAll('.cg-cell').forEach(b => b.addEventListener('click', () => {
        if (!revealed.has(b.dataset.ch)) { selectedChar = b.dataset.ch; sfx.tap(); render(); }
      }));

      const kb = document.getElementById('cg-kb');
      const cgRows = [['Й','Ц','У','К','Е','Н','Г','Ш','Щ','З','Х'],['Ф','Ы','В','А','П','Р','О','Л','Д','Ж','Э'],['Я','Ч','С','М','И','Т','Ь','Б','Ю','⌫']];
      kb.innerHTML = cgRows.map(row => `<div class="flex justify-center gap-1">${row.map(l => `<button class="cg-key ${l === '⌫' ? 'px-3 bg-rose-500/25 text-rose-400' : 'flex-1 min-w-[24px] max-w-[34px] surface-pill border'} h-10 rounded-lg font-bold text-xs flex items-center justify-center transition">${l}</button>`).join('')}</div>`).join('');
      kb.querySelectorAll('.cg-key').forEach(b => b.addEventListener('click', () => inputLetter(b.textContent)));
    }

    function inputLetter(ch) {
      if (finished || !selectedChar || revealed.has(selectedChar)) return;
      if (ch === '⌫') {
        delete userMap[selectedChar];
        delete wrongMap[selectedChar];
        sfx.tap(); render(); persist(); return;
      }
      const norm = ch === 'Ё' ? 'Е' : ch;
      if (norm === selectedChar) {
        userMap[selectedChar] = norm;
        delete wrongMap[selectedChar];
        sfx.good();
        const next = uniqueLetters.find(c => !revealed.has(c) && userMap[c] !== c);
        if (next) selectedChar = next;
        render();
        if (checkWin()) { finished = true; setTimeout(() => completeGame('cryptogram', `«${p.quote}» — ${p.author}`), 250); }
        else persist();
      } else {
        wrongMap[selectedChar] = norm;
        delete userMap[selectedChar];
        render();
        const dead = loseLife(`Буква «${norm}» не подходит для кода №${cipherMap[selectedChar]}! (−1 ❤️)`);
        if (dead) finished = true;
        else persist();
      }
    }

    document.getElementById('cg-weak-hint').addEventListener('click', () => revealOneLetter(15));
    const onKey = (e) => { if (e.key === 'Backspace') inputLetter('⌫'); else { const up = e.key.toUpperCase().replace('Ё','Е'); if (/^[А-Я]$/.test(up)) inputLetter(up); } };
    window.addEventListener('keydown', onKey); activeCleanup = () => window.removeEventListener('keydown', onKey);
    activeHintFn = () => revealOneLetter(20);
    render();
  }

  // =========================================================================
  // GAME 10: ЦЕПОЧКА СЛОВ (With Save/Restore)
  // =========================================================================
  function initWordChainGame(stage, saved) {
    const p = saved?.puzzle || pickPuzzle('wc', PUZZLES.wordchain);
    let idx = saved?.idx || 1, revealedCount = saved?.revealedCount || 1, finished = false;
    function persist() { if (!finished) saveGameSession('wordchain', { puzzle: p, idx, revealedCount, lives: gameLives }); }
    onSyncLivesCallback = persist;

    stage.innerHTML = `
      <div class="w-full max-w-md flex flex-col items-center">
        <div class="text-xs font-bold uppercase tracking-wider text-emerald-400 bg-emerald-500/20 border border-emerald-400/30 px-3 py-1 rounded-full mb-4">Тема: ${p.theme}</div>
        <div id="wc-list" class="w-full space-y-2 mb-4"></div>
        <form id="wc-form" class="flex gap-2 w-full"><input id="wc-input" type="text" placeholder="Следующее слово..." class="flex-1 px-4 py-3 rounded-xl surface-pill border-2 focus:border-amber-400 focus:outline-none font-black text-center text-base uppercase tracking-widest" autocomplete="off" /><button type="submit" class="px-5 py-3 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-sm">ОК</button></form>
      </div>
    `;
    onContinueCallback = () => { finished = false; render(); persist(); };
    function render() {
      document.getElementById('wc-list').innerHTML = p.words.map((w, i) => {
        if (i < idx) return `<div class="px-4 py-2.5 rounded-xl bg-emerald-500/25 border border-emerald-400/40 text-emerald-400 font-black tracking-widest flex justify-between"><span>${i + 1}.</span><span>${w}</span><span>✓</span></div>`;
        if (i === idx) { const hint = w.slice(0, revealedCount) + ' •'.repeat(w.length - revealedCount); return `<div class="px-4 py-2.5 rounded-xl bg-amber-400/15 border-2 border-amber-400 text-amber-400 font-black tracking-widest flex justify-between"><span>${i + 1}.</span><span>${hint}</span><span class="text-xs font-bold">${w.length} б.</span></div>`; }
        return `<div class="px-4 py-2.5 rounded-xl surface-pill border opacity-50 font-bold tracking-widest flex justify-between"><span>${i + 1}.</span><span>${'• '.repeat(w.length).trim()}</span><span class="text-xs">${w.length} б.</span></div>`;
      }).join('');
    }
    document.getElementById('wc-form').addEventListener('submit', (e) => {
      e.preventDefault(); if (finished) return;
      const inp = document.getElementById('wc-input'), val = inp.value.trim().toUpperCase().replace(/Ё/g, 'Е'), target = p.words[idx];
      if (!val) return;
      if (val === target) { sfx.good(); idx += 1; revealedCount = 1; inp.value = ''; render(); if (idx >= p.words.length) { finished = true; setTimeout(() => completeGame('wordchain'), 200); } else persist(); }
      else { if (revealedCount < target.length - 1) revealedCount += 1; inp.classList.add('shake'); setTimeout(() => inp.classList.remove('shake'), 350); render(); if (loseLife('Неверное слово в цепочке!')) finished = true; }
    });
    activeHintFn = () => { if (finished || !spendCoinsForHint(20)) return; if (revealedCount < p.words[idx].length) revealedCount += 1; render(); persist(); };
    render();
  }

  // =========================================================================
  // GAME 11: СТОП-ИГРА! (With Save/Restore)
  // =========================================================================
  function initStopGame(stage, saved) {
    const p = saved?.puzzle || pickPuzzle('sg', PUZZLES.stopgame);
    const draftVals = saved?.vals || [];
    const samples = {
      'К':['Киев','Ксерокс','Криминальное чтиво','Консультант','Карбонара'],
      'М':['Мадрид','Майкрософт','Матрица','Маркетолог','Мохито'],
      'С':['Сингапур','Спотифай','Сопрано','Сценарист','Стейк'],
      'П':['Прага','Порше','Побег','Продюсер','Паста'],
      'А':['Амстердам','Адидас','Аватар','Архитектор','Апероль'],
      'В':['Вена','Вольво','Во все тяжкие','Венчурный инвестор','Виски'],
      'Б':['Берлин','БМВ','Бойцовский клуб','Брокер','Бургер'],
      'Р':['Рим','Ролекс','Рокки','Режиссёр','Ризотто'],
      'Т':['Токио','Тесла','Титаник','Трейдер','Тирамису'],
      'Д':['Дубай','Дисней','Джокер','Дизайнер','Дайкири']
    };
    let finished = false;

    function persist() {
      if (!finished) {
        const vals = [...stage.querySelectorAll('.sg-inp')].map(inp => inp.value);
        saveGameSession('stopgame', { puzzle: p, vals, lives: gameLives });
      }
    }
    onSyncLivesCallback = persist;

    stage.innerHTML = `
      <div class="w-full max-w-md flex flex-col items-center">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-red-500 to-rose-600 text-white font-black text-3xl flex items-center justify-center shadow-lg mb-2">${p.letter}</div>
        <p class="text-xs text-muted-adaptive mb-4 text-center">Подберите слова 20+ на букву «<strong class="text-amber-400">${p.letter}</strong>»:</p>
        <form id="sg-form" class="w-full space-y-3">
          ${p.categories.map((cat, i) => `<div class="flex items-center gap-2"><label class="w-36 text-xs font-bold text-white-adaptive">${cat}</label><input data-i="${i}" value="${draftVals[i] || ''}" type="text" placeholder="${p.letter}..." class="sg-inp flex-1 px-3 py-2.5 rounded-xl surface-pill border-2 focus:border-amber-400 focus:outline-none font-bold text-sm" autocomplete="off" /></div>`).join('')}
          <button type="submit" class="w-full mt-2 py-3 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-sm transition">СТОП! Проверить</button>
        </form>
      </div>
    `;
    stage.querySelectorAll('.sg-inp').forEach(inp => inp.addEventListener('input', persist));
    onContinueCallback = () => { finished = false; };
    document.getElementById('sg-form').addEventListener('submit', (e) => {
      e.preventDefault(); if (finished) return;
      const inputs = [...stage.querySelectorAll('.sg-inp')], vals = inputs.map(inp => inp.value.trim().toUpperCase().replace(/Ё/g, 'Е'));
      const badIdx = vals.findIndex(v => v.length < 3 || v[0] !== p.letter);
      if (badIdx !== -1 || new Set(vals).size < vals.length) {
        if (badIdx !== -1) { inputs[badIdx].classList.add('shake'); setTimeout(() => inputs[badIdx].classList.remove('shake'), 350); }
        if (loseLife('Проверьте первую букву, уникальность и длину слов (от 3 букв)!')) finished = true;
        return;
      }
      finished = true; completeGame('stopgame', `Отличная подборка на букву «${p.letter}»!`);
    });
    activeHintFn = () => { if (finished) return; const inputs = [...stage.querySelectorAll('.sg-inp')], empty = inputs.find(inp => inp.value.trim().length < 3); if (!empty || !spendCoinsForHint(20)) return; empty.value = (samples[p.letter] || [])[+empty.dataset.i] || `${p.letter}...`; sfx.good(); persist(); };
  }

  // =========================================================================
  // GAME 12: КЛУБОК (With Save/Restore)
  // =========================================================================
  function initTangleGame(stage, saved) {
    const p = saved?.puzzle || generateTanglePuzzle();
    const chain = saved?.chain ? [...saved.chain] : [p.start];
    let finished = false;
    function persist() { if (!finished) saveGameSession('tangle', { puzzle: p, chain, lives: gameLives }); }
    onSyncLivesCallback = persist;

    stage.innerHTML = `
      <div class="w-full max-w-md flex flex-col items-center">
        <div class="flex items-center gap-3 mb-4">
          <span class="px-4 py-2 rounded-xl bg-amber-400/20 border border-amber-400/40 text-amber-400 font-black tracking-widest">${p.start}</span>
          <span class="text-muted-adaptive font-bold">→</span>
          <span class="px-4 py-2 rounded-xl bg-emerald-500/20 border border-emerald-400/40 text-emerald-400 font-black tracking-widest">${p.target}</span>
        </div>
        <div id="tg-chain" class="flex flex-wrap justify-center gap-2 mb-4"></div>
        <form id="tg-form" class="flex gap-2 w-full"><input id="tg-input" type="text" maxlength="4" placeholder="Слово из 4 букв..." class="flex-1 px-4 py-3 rounded-xl surface-pill border-2 focus:border-amber-400 focus:outline-none font-black text-center text-lg uppercase tracking-widest" autocomplete="off" /><button type="submit" class="px-5 py-3 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-sm">Ход</button></form>
        <p class="text-xs text-muted-adaptive mt-3">Меняйте 1 букву за ход (ориентир: ${p.par} ходов)</p>
      </div>
    `;
    onContinueCallback = () => { finished = false; render(); persist(); };
    function render() { document.getElementById('tg-chain').innerHTML = chain.map((w, i) => `<span class="px-3 py-1.5 rounded-xl font-black text-sm tracking-widest ${i === chain.length - 1 ? 'bg-amber-400 text-slate-950' : 'surface-pill border'}">${w}</span>`).join(''); }
    document.getElementById('tg-form').addEventListener('submit', (e) => {
      e.preventDefault(); if (finished) return;
      const inp = document.getElementById('tg-input'), val = inp.value.trim().toUpperCase().replace(/Ё/g, 'Е'), prev = chain[chain.length - 1];
      if (!val) return;
      if (!diff1(prev, val) || (!TANGLE_4_SET.has(val) && val !== p.target)) {
        if (loseLife(!diff1(prev, val) ? 'Нужно изменить ровно ОДНУ букву!' : 'Слова нет в словаре!')) finished = true;
        return;
      }
      chain.push(val); inp.value = ''; sfx.good(); render();
      if (val === p.target) { finished = true; setTimeout(() => completeGame('tangle', `Маршрут пройден за ${chain.length - 1} ход(ов)!`), 200); } else persist();
    });
    activeHintFn = () => { if (finished || !spendCoinsForHint(20)) return; showToast(`Путь: ${p.path.join(' → ')}`); };
    render();
  }

  // =========================================================================
  // 6. PROFILE MODAL: LEADERBOARD, PER-GAME STATS & BADGES
  // =========================================================================
  function renderProfileTabContent(tab) {
    const bodyEl = document.getElementById('modal-body');
    if (!bodyEl) return;

    const lvl = getLevel(state.xp);
    const headerSummary = `
      <div class="grid grid-cols-4 gap-2 mb-4 text-center">
        <div class="bg-white/10 rounded-xl p-2"><div class="text-base font-black text-white">${lvl}</div><div class="text-[10px] text-slate-400 font-bold">Уровень</div></div>
        <div class="bg-amber-500/20 rounded-xl p-2"><div class="text-base font-black text-amber-300">${state.chessElo || 1000}</div><div class="text-[10px] text-amber-300 font-bold">Шахматы ELO</div></div>
        <div class="bg-emerald-500/20 rounded-xl p-2"><div class="text-base font-black text-emerald-300">${state.totalSolved}</div><div class="text-[10px] text-emerald-300 font-bold">Побед</div></div>
        <div class="bg-orange-500/20 rounded-xl p-2"><div class="text-base font-black text-orange-300">${state.bestBlitz || 0} ⚡</div><div class="text-[10px] text-orange-300 font-bold">Блиц</div></div>
      </div>
      <div class="grid grid-cols-3 gap-1.5 p-1 rounded-xl bg-white/5 border border-white/10 mb-4 text-xs font-black">
        <button data-ptab="leaders" class="ptab-btn py-1.5 rounded-lg transition ${tab === 'leaders' ? 'bg-amber-400 text-slate-950' : 'text-slate-300 hover:bg-white/10'}">🏅 Лидеры</button>
        <button data-ptab="games" class="ptab-btn py-1.5 rounded-lg transition ${tab === 'games' ? 'bg-amber-400 text-slate-950' : 'text-slate-300 hover:bg-white/10'}">🎮 По играм</button>
        <button data-ptab="badges" class="ptab-btn py-1.5 rounded-lg transition ${tab === 'badges' ? 'bg-amber-400 text-slate-950' : 'text-slate-300 hover:bg-white/10'}">🎖️ Ачивки</button>
      </div>
    `;

    let sectionHtml = '';
    if (tab === 'leaders') {
      const me = {
        name: `${playerDisplayName} (Вы)`,
        xp: state.xp,
        elo: state.chessElo || 1000,
        blitz: state.bestBlitz || 0,
        tag: `Ур. ${lvl} • ${state.totalSolved} побед`,
        isMe: true
      };
      const rows = [...LEADERBOARD_BOTS, me].sort((a, b) => b.xp - a.xp || b.elo - a.elo);
      sectionHtml = `<div class="space-y-2">${rows.map((r, idx) => {
        const medal = idx === 0 ? '🥇' : (idx === 1 ? '🥈' : (idx === 2 ? '🥉' : `#${idx + 1}`));
        return `
          <div class="flex items-center justify-between p-2.5 rounded-xl border ${r.isMe ? 'bg-amber-400/20 border-amber-400/50' : 'bg-white/5 border-white/10'}">
            <div class="flex items-center gap-2.5">
              <span class="w-6 text-center font-black text-sm ${r.isMe ? 'text-amber-300' : 'text-slate-300'}">${medal}</span>
              <div>
                <div class="text-xs font-black ${r.isMe ? 'text-amber-300' : 'text-white'}">${r.name}</div>
                <div class="text-[10px] text-slate-400">${r.tag} • ELO ${r.elo} • Блиц ${r.blitz}</div>
              </div>
            </div>
            <div class="text-xs font-black text-emerald-300">${r.xp} XP</div>
          </div>
        `;
      }).join('')}</div>`;
    } else if (tab === 'games') {
      sectionHtml = `<div class="space-y-2">${GAMES_META.map(g => {
        const solvedDaysCount = DAYS.filter(d => !!(state.solved[d.id] && state.solved[d.id][g.id])).length;
        const hasSession = !!gameSessions[g.id];
        let extra = `Дней закрыто: ${solvedDaysCount}/${DAYS.length}`;
        if (g.id === 'chess') extra = `Рейтинг: ${state.chessElo || 1000} ELO`;
        return `
          <div class="flex items-center justify-between p-2.5 rounded-xl bg-white/5 border border-white/10">
            <div class="flex items-center gap-2.5">
              <span class="text-xl">${g.icon}</span>
              <div>
                <div class="text-xs font-black text-white">${g.name}</div>
                <div class="text-[10px] text-slate-400">${extra}</div>
              </div>
            </div>
            <span class="text-[11px] font-black px-2 py-0.5 rounded-lg ${hasSession ? 'bg-amber-400/20 text-amber-300' : (solvedDaysCount > 0 ? 'bg-emerald-500/20 text-emerald-300' : 'bg-white/10 text-slate-400')}">
              ${hasSession ? 'В процессе' : (solvedDaysCount > 0 ? 'Активен' : 'Новый')}
            </span>
          </div>
        `;
      }).join('')}</div>`;
    } else {
      sectionHtml = `<div class="space-y-2">${BADGES.map(b => {
        const unlocked = b.check(state);
        return `<div class="flex items-center gap-3 p-2.5 rounded-xl border ${unlocked ? 'bg-amber-400/15 border-amber-400/40' : 'bg-white/5 border-white/10 opacity-50'}"><div class="text-2xl">${b.icon}</div><div><div class="font-bold text-white text-xs">${b.name} ${unlocked ? '✓' : ''}</div><div class="text-[11px] text-slate-400">${b.desc}</div></div></div>`;
      }).join('')}</div>`;
    }

    bodyEl.innerHTML = headerSummary + sectionHtml;
    bodyEl.querySelectorAll('.ptab-btn').forEach(btn => {
      btn.addEventListener('click', () => { sfx.tap(); renderProfileTabContent(btn.dataset.ptab); });
    });
  }

  // =========================================================================
  // 7. GLOBAL EVENT WIRING & AUTO-DICTIONARY MERGE
  // =========================================================================
  window.addEventListener('pagehide', flushSessionsNow);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flushSessionsNow(); });

  document.getElementById('btn-home').addEventListener('click', showHub);
  document.getElementById('btn-back-hub').addEventListener('click', showHub);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-overlay').addEventListener('click', (e) => { if (e.target.id === 'modal-overlay') closeModal(); });

  document.querySelectorAll('.theme-btn').forEach(btn => btn.addEventListener('click', () => { sfx.tap(); applyTheme(btn.dataset.theme); }));

  document.getElementById('btn-daily-bonus').addEventListener('click', () => { sfx.tap(); openDailyBonusModal(); });
  document.getElementById('btn-hero-bonus').addEventListener('click', () => { sfx.tap(); openDailyBonusModal(); });

  document.getElementById('btn-sound').addEventListener('click', (e) => { soundEnabled = !soundEnabled; e.currentTarget.textContent = soundEnabled ? '🔊' : '🔇'; if (soundEnabled) sfx.tap(); });
  document.getElementById('btn-toggle-hard').addEventListener('click', () => { sfx.tap(); state.hardMode = !state.hardMode; renderHub(); showToast(state.hardMode ? 'Сложность Pro ⚡' : 'Стандарт 20+'); });
  document.getElementById('btn-endless-mode').addEventListener('click', () => { sfx.tap(); state.endless = !state.endless; renderHub(); });
  document.getElementById('btn-start-blitz').addEventListener('click', () => { sfx.tap(); startBlitz(); });
  document.getElementById('btn-start-chess').addEventListener('click', () => { sfx.tap(); launchGame('chess', false); });
  document.getElementById('btn-restart-same').addEventListener('click', () => {
    if (!state.activeGame) return;
    sfx.tap();
    if (typeof activeForceNewFn === 'function') activeForceNewFn();
    else launchGame(state.activeGame, true);
  });
  document.getElementById('btn-new-round').addEventListener('click', () => { if (!state.activeGame) return; sfx.tap(); state.endless = true; launchGame(state.activeGame, true); });
  document.getElementById('btn-game-rules').addEventListener('click', () => { if (state.activeGame) showTutorial(state.activeGame, true); });
  document.getElementById('btn-game-hint').addEventListener('click', () => { if (typeof activeHintFn === 'function') activeHintFn(); });

  document.getElementById('btn-profile').addEventListener('click', () => {
    sfx.tap();
    openModal('🏆 Профиль borevichh quiz #7', '', `<button id="prof-ok" class="px-4 py-2 rounded-xl bg-amber-400 text-slate-950 font-black text-sm">Закрыть</button>`);
    renderProfileTabContent('leaders');
    document.getElementById('prof-ok').addEventListener('click', closeModal);
  });

  const _origApplyTheme = applyTheme;
  applyTheme = function(theme) {
    _origApplyTheme(theme);
    if (tg && tg.setHeaderColor && tg.setBackgroundColor) {
      const colors = { dark: '#0b0e1a', light: '#ffffff', cr7: '#190509' };
      const c = colors[theme] || '#0b0e1a';
      try { tg.setHeaderColor(c); tg.setBackgroundColor(c); } catch (_) {}
    }
  };

  async function mergeExternalPuzzles() {
    try {
      const res = await fetch(`./extra_puzzles.json?v=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) return;
      const ext = await res.json();
      if (Array.isArray(ext.words5) && ext.words5.length) {
        PUZZLES.password5 = [...new Set([...PUZZLES.password5, ...ext.words5])];
      }
      if (Array.isArray(ext.words6) && ext.words6.length) {
        PUZZLES.password6 = [...new Set([...PUZZLES.password6, ...ext.words6])];
      }
      if (Array.isArray(ext.tangle4) && ext.tangle4.length) {
        ext.tangle4.forEach(w => {
          if (typeof w === 'string' && w.length === 4 && !TANGLE_4_SET.has(w)) {
            TANGLE_4_SET.add(w);
            TANGLE_4_WORDS.push(w);
          }
        });
      }
      if (Array.isArray(ext.cryptograms) && ext.cryptograms.length) {
        PUZZLES.cryptogram.push(...ext.cryptograms);
      }
      if (Array.isArray(ext.wordchains) && ext.wordchains.length) {
        PUZZLES.wordchain.push(...ext.wordchains);
      }
    } catch (_) {}
  }

  loadState();
  applyTheme(state.theme || 'dark');
  renderHub();
  mergeExternalPuzzles();

  const startMode = new URLSearchParams(window.location.search).get('mode');
  if (startMode === 'chess') launchGame('chess', false);
  else if (startMode === 'blitz') startBlitz();
})();
</script>
</body>
</html>
